/* Google Sans Flex (opsz 120 instance, wght 300–700) — SIL Open Font License 1.1 */
/* =========================================================
   MOTION TOKENS — one ease for everything (edit here or press M)
   ========================================================= */
:root{
  --ease: cubic-bezier(.62,.05,.01,.99);
  --speed: 1;               /* duration multiplier */
  --pink:#e599ff; --pink-2:#d480ff;
  --ink:#000; --paper:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
/* 1rem = 10 design-px of the 1920 artboard */
html{font-size:calc(100vw / 192)}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:'GSF','Google Sans Flex',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button{all:unset;cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:1px dashed currentColor;outline-offset:3px}

/* mask reveal primitives */
.m{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.mi{display:block}
span.m,span.mi{display:inline-block}

/* ---------- NAV ---------- */
#nav{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;justify-content:space-between;align-items:center;color:#fff;mix-blend-mode:difference;
  padding:.6rem 1.2rem;font-weight:500;font-size:max(2rem,13px);letter-spacing:-.02em;line-height:1.25}
#navBack{visibility:hidden}
.on-project #navBack{visibility:visible}
#navMarker{position:fixed;z-index:21;left:0;top:0;width:max(.5rem,4px);height:max(.5rem,4px);margin-top:calc(max(.5rem,4px) / -2);background:var(--pink-2);transform-origin:50% 50%}
/* hover roll (per-char) */
.roll .c{display:inline-block;position:relative;white-space:pre;transition:transform calc(.7s * var(--speed)) var(--ease);transition-delay:calc(var(--i) * 14ms)}
.roll .c::after{content:attr(data-c);position:absolute;left:0;top:100%}
a:hover .roll .c,button:hover .roll .c{transform:translateY(-100%)}

/* ---------- PAGES ---------- */
.page{position:absolute;inset:0;overflow:hidden;visibility:hidden;z-index:1}
.page.on{visibility:visible}
#home{user-select:none;-webkit-user-select:none;touch-action:none}

/* project column */
#col{position:absolute;left:115.5rem;width:62rem;top:0;height:100%}
.card{position:absolute;left:0;top:0;width:100%;overflow:hidden;will-change:transform;cursor:pointer;background:#eee}
.card-in{position:absolute;inset:0;transition:transform calc(1s * var(--speed)) var(--ease)}
.card:hover .card-in{transform:scale(1.035)}
.media{position:absolute;inset:0;will-change:transform}
.media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.logo{position:absolute;left:1.94em;top:1.55em;width:1.68em;height:1.68em;display:grid;place-items:center;font-weight:700}
.tag{position:absolute;right:1.94em;top:1.4em;font-size:.904em;font-weight:300;letter-spacing:-.03em;line-height:1.2;white-space:nowrap}
.tag em{font-style:normal;margin:0 .6em;font-size:.85em;opacity:.8}

.ph-ads{background:#060e11}

.ph-nobi .t{position:absolute;font-weight:600;font-size:9.69em;color:#fff;line-height:1.2;white-space:nowrap;transform:rotate(-8deg) skewX(-10deg)}

.ph-nobi .lap{position:absolute;left:14.5em;top:8em;width:33em;height:21em;background:#1c1c20;border-radius:1.2em 1.2em 0 0;padding:1em;box-shadow:0 2em 4em rgba(120,60,0,.25)}
.ph-nobi .lap i{display:block;height:100%;border-radius:.3em;background:linear-gradient(90deg,#eef1f5 0 16%,transparent 16%),repeating-linear-gradient(180deg,#fff 0 2em,#f6f8fb 2em 4em)}
.ph-nobi .base{position:absolute;left:11.5em;top:29em;width:39em;height:1.4em;background:linear-gradient(180deg,#e2e3e6,#9a9ca2);border-radius:0 0 1.4em 1.4em}

/* avatar image (fixed-size, centred: the pill clips it while it opens) */
.av-wrap{position:absolute;top:0;bottom:0;left:50%;width:var(--pw);margin-left:calc(var(--pw) / -2)}
.av-wrap.full{left:0;right:0;width:auto;margin-left:0}
.av-wrap img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
/* pill: ảnh mới trồi lên bằng mask từ dưới lên, ảnh bên trong zoom out nhẹ */
.av-layer{position:absolute;inset:0;overflow:hidden;clip-path:inset(100% 0 0 0)}
.av-layer img{position:absolute;inset:0;transform:scale(1.25)}
/* avatar placeholder */
.avatar{position:absolute;inset:0;overflow:hidden}
.avatar i{position:absolute;left:50%;background:rgba(40,0,60,.2)}
.avatar .hd{top:20%;width:32%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%)}
.avatar .bd{top:62%;width:78%;height:70%;border-radius:50% 50% 0 0;transform:translateX(-50%)}

/* social */
.soc-wrap{position:absolute;left:1.2rem;display:flex;flex-direction:column;gap:1.6rem}
.soc{display:grid;place-items:center;width:2.8rem;height:2.8rem;color:#fff;font-weight:700;font-size:1.2rem;letter-spacing:-.02em;transition:transform calc(.6s * var(--speed)) var(--ease)}
.soc:hover{transform:scale(1.15) rotate(-6deg)}
.soc.be{background:#0057ff}.soc.li{background:#007ebb}
.soc img{display:block;width:100%;height:100%}
#soc{top:calc(50% - 6.7rem)}

/* Work + Detail */
.list{position:absolute;top:calc(50% - 6.7rem);text-align:right;font-weight:500;font-size:max(1.6rem,11px);letter-spacing:-.01em;line-height:1.25}
.list .lbl{opacity:.4;margin-bottom:1.6rem}
#work{right:82.1rem;--wdir:-1}
.wl{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
.wi{display:block;opacity:.2;will-change:opacity,transform}
.wm{position:absolute;right:-1.3rem;top:0;width:max(.5rem,4px);height:max(.5rem,4px);margin-top:calc(max(.5rem,4px) / -2);background:var(--pink-2);opacity:0}
#detail{right:1.2rem;width:14rem}
.dls{display:flex;flex-direction:column;gap:.6rem}
.dl{position:relative;height:1.25em;overflow:hidden}
.dv{position:absolute;right:0;top:0;white-space:nowrap}
.dv .ch{display:inline-block}

/* headline */
#hl{position:absolute;left:0;bottom:1.2rem;font-weight:600;font-size:10rem;line-height:1;letter-spacing:-.02em;white-space:nowrap}
#hl>div+div{margin-top:-.04em}
.hl1{margin-left:22rem;opacity:.1}
.hl2{margin-left:2.8rem;display:flex;gap:2rem;align-items:flex-start}
.hl3{margin-left:6.8rem;display:flex;gap:8.5rem}
#pill{--pw:14rem;position:relative;display:block;width:var(--pw);height:9rem;border-radius:99rem;background:var(--pink);overflow:hidden;flex:none}
.sq{display:inline-block;width:1.2rem;height:1.2rem;background:#000;margin-left:.4rem;vertical-align:baseline}

/* ---------- ABOUT ---------- */
#about .vl{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.1);transform-origin:50% 0}
.ab{position:absolute}
.arow,.srow{display:contents}
#aname{left:1.2rem;top:5.3rem;font-weight:600;font-size:10rem;line-height:1;letter-spacing:-.02em;white-space:nowrap}
#aname .an1{opacity:.1}
#aname .sq{width:1.4rem;height:1.4rem;margin-left:.1rem;position:relative;top:-.04em}
.acol{top:5.3rem;text-align:right;font-weight:500;font-size:max(1.6rem,11px);line-height:1.25;letter-spacing:-.01em}
.acol .t{opacity:.5;margin-bottom:4rem}
.acol .grp+.grp{margin-top:4.8rem}
.acol .n{margin-bottom:1.2rem}
.acol .d{opacity:.4;margin-top:.6rem}
#exp{right:60.6rem;width:14rem}
#cert{right:1.2rem;width:22rem}
#bio{left:61.9rem;top:calc(50% + 9rem);width:40.6rem;font-weight:500;font-size:max(2rem,13px);line-height:1.25;letter-spacing:-.01em}
#bio .m{padding-bottom:.12em;margin-bottom:-.12em}
#asoc{top:calc(50% + 9rem)}
#asoc .soc{width:3.2rem;height:3.2rem;font-size:1.4rem}
#aport{left:1.2rem;bottom:1.2rem;display:flex;gap:1.6rem;align-items:flex-end}
.pbox{position:relative;width:16rem;height:16rem;background:var(--pink);overflow:hidden;flex:none}
.contact{display:flex;flex-direction:column;gap:.6rem;font-weight:500;font-size:max(2rem,13px);line-height:1.25;white-space:nowrap}
.contact .dim{opacity:.4}
.stat{bottom:1.2rem;white-space:nowrap}
.stat .num{font-weight:600;font-size:9.6rem;line-height:1.2;letter-spacing:-.02em}
.stat .num i{font-style:normal;color:var(--pink)}
.stat .sl{font-weight:500;font-size:max(2rem,13px);line-height:1.6;letter-spacing:-.01em}
#st1{left:61.9rem}
#st2{right:60.6rem;text-align:right}
#st3{right:1.2rem;text-align:right}

/* ---------- CURTAIN / LOADER ---------- */
#curtain{position:fixed;inset:0;z-index:50;background:#000;color:#fff;will-change:transform}
#ld{position:absolute;left:4rem;right:4rem;bottom:3.2rem}
#ldRow{display:flex;justify-content:space-between;align-items:flex-end}
#ldNum{font-weight:700;font-size:12.8rem;line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums;padding-right:.08em}
#ldHandle{font-weight:700;font-size:max(3.6rem,16px);line-height:1.25;letter-spacing:-.01em}
#ldLine{position:relative;height:1px;margin-top:1.6rem;background:rgba(255,255,255,.2);transform-origin:100% 50%}
#ldFill{position:absolute;inset:0;background:#fff;transform-origin:0 50%;transform:scaleX(0)}
#clabel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:600;font-size:max(4.8rem,28px);line-height:1;letter-spacing:-.01em}
#clabel .mi{transform:translateY(110%)}

/* ---------- CURSOR ---------- */
#cur{position:fixed;left:0;top:0;width:0;height:0;z-index:100;pointer-events:none;mix-blend-mode:difference;display:none}
.cursor-on #cur{display:block}
.cursor-on,.cursor-on *:not(.lil-gui):not(.lil-gui *){cursor:none!important}
#cur .cb{position:absolute;left:0;top:0;width:10px;height:10px;transform:translate(-50%,-50%);background:#fff;display:grid;place-items:center;
  transition:width calc(.7s * var(--speed)) var(--ease),height calc(.7s * var(--speed)) var(--ease)}
#cur .cb span{font-weight:600;font-size:11px;letter-spacing:.04em;white-space:nowrap;line-height:1.25;text-align:center;color:#000;opacity:0;transition:opacity .25s}
#cur.is-link .cb{width:26px;height:26px}
#cur.is-card .cb{width:80px;height:80px}
#cur.is-card .cb span{opacity:1}
#cur.is-down .cb{width:60px;height:60px}

/* ---------- CARD TAP AFFORDANCE (touch only: no hover there) ---------- */
.card-btn{position:absolute;right:max(1rem,10px);bottom:max(1rem,10px);width:max(4rem,40px);height:max(4rem,40px);display:none;place-items:center;background:#000;color:#fff;z-index:2;pointer-events:none}
.card-btn i{font-style:normal;font-weight:500;font-size:max(2rem,20px);line-height:1;color:var(--pink);transform:rotate(45deg)}
@media (hover:none),(max-width:760px){ .card-btn{display:grid} }

/* ---------- WEBGL BEND ---------- */
#gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.gl-on .card .media{visibility:hidden}
.gl-on .card{background:transparent}
/* ---------- GUI (lil-gui) ---------- */
.lil-gui.autoPlace{left:6.4rem;right:auto;top:5rem;max-height:calc(100% - 7rem);z-index:95}
#cur.is-off{opacity:0}

/* ---------- PROJECT PAGE — the client's frames, stacked full-width ---------- */
#project{background:#fff}
.pj-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pj-scroll::-webkit-scrollbar{display:none}
.pj-scroll.lenis-stopped{overflow:clip}
.pj-stack{position:relative}
.pj-f{position:relative;margin:0;overflow:hidden;background:#fff}
.pj-fi{position:relative;overflow:hidden;transform-origin:50% 50%}
.pj-fi img{display:block;width:100%;height:auto;transform-origin:50% 50%;-webkit-user-drag:none}
.pj-f.is-fixed .pj-fi{position:absolute;inset:0}
.pj-f.is-fixed .pj-fi img{height:100%;object-fit:cover}
.pj-ph{position:absolute;inset:0;background:#f2f2f2}
.pj-f:nth-child(even) .pj-ph{background:#eaeaea}
.pj-ph .ph-sq{position:absolute;left:50%;top:50%;width:max(1.2rem,8px);height:max(1.2rem,8px);margin:calc(max(1.2rem,8px) / -2) 0 0 calc(max(1.2rem,8px) / -2);background:var(--pink)}
.pj-ph .ph-lbl,.pj-ph .ph-sz{position:absolute;bottom:1.2rem;font-weight:500;font-size:max(1.4rem,10px);opacity:.45}
.pj-ph .ph-lbl{left:1.2rem}
.pj-ph .ph-sz{right:1.2rem}
.pj-end{position:relative;background:#fff;padding-top:12rem}
.pj-lbl{font-weight:500;font-size:max(1.6rem,11px);line-height:1.25;opacity:.5}
.rv-in{position:absolute;inset:0;overflow:hidden}
.pj-next{position:relative;display:block;padding:0 1.2rem 1.2rem;cursor:pointer}
.pj-next .row{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem}
.pj-next .name{flex:1 1 0;min-width:0;font-weight:600;font-size:16rem;line-height:1;letter-spacing:-.03em;white-space:normal;transition:transform calc(.9s * var(--speed)) var(--ease)}
.pj-next .name .m{display:inline-block;vertical-align:bottom}   /* tên dài tự xuống dòng; fitNextName() thu nhỏ chữ cho vừa */
.pj-next:hover .name{transform:translateX(2rem)}
.pj-thumb{position:relative;flex:none;width:62rem;aspect-ratio:620/349}
.pj-thumb .rv-in{background:#eee}
.pj-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform calc(1s * var(--speed)) var(--ease)}
.pj-next:hover .pj-thumb img{transform:scale(1.05)}
.pj-next .top{display:flex;justify-content:space-between;margin-bottom:2rem}
.pj-foot{display:flex;justify-content:space-between;padding:6rem 1.2rem 1.2rem;font-weight:500;font-size:max(1.6rem,11px);opacity:.5}
.rv-text .mi{transform:translateY(110%)}
.rv-img .rv-in{clip-path:inset(100% 0 0 0)}
/* shared-element overlay: the clicked thumbnail grows into frame 1 (and back) */
#xfer{position:fixed;left:0;top:0;width:0;height:0;z-index:15;overflow:hidden;display:none;pointer-events:none;background:#fff}
#xfer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}

/* ---------- MOBILE ---------- */
@media (max-width:760px){
  html{font-size:calc(100vw / 39)}
  #ld{top:1.2rem;bottom:2.4rem;left:1.6rem;right:1.6rem;display:flex;flex-direction:column}
  #ldRow{flex:1;flex-direction:column-reverse;justify-content:space-between;align-items:flex-start}
  #ldNum{font-size:10rem}
  #ldHandle{font-size:2rem}
  #nav{font-size:1.5rem;padding:.9rem 1.2rem}
  #navBack{display:none}
  .on-project #navBack{display:none}   /* mobile: bỏ hẳn nút BACK ở trang dự án (dùng HOME để quay về) */
  #col{left:1.2rem;right:1.2rem;width:auto;top:4.4rem;height:calc(100% - 4.4rem - 27rem - var(--wx,0rem));overflow:hidden}
  #soc{display:none}
  .list{top:calc(100% - 25.6rem - var(--wx,0rem));font-size:1.3rem}
  .list .lbl{margin-bottom:1rem}
  #work{left:2.2rem;right:auto;text-align:left;--wdir:1}
  .wl{align-items:flex-start;gap:.4rem}
  .wm{right:auto;left:-1rem}
  .dls{gap:.4rem}
  #detail{width:12rem}
  #hl{font-size:3.6rem;bottom:1.6rem}
  .hl1{margin-left:6rem}.hl2{margin-left:1.2rem;gap:.8rem}.hl3{margin-left:2rem;gap:1.5rem}
  #pill{--pw:5rem;width:var(--pw);height:3.2rem}
  .sq{width:.45rem;height:.45rem;margin-left:.2rem}
  #about{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:5.6rem 1.2rem 3rem;display:flex;flex-direction:column;gap:3.6rem}
  #about .vl{display:none}
  .ab{position:static}
  #aname{font-size:4.8rem}
  #aname .sq{width:.7rem;height:.7rem}
  .arow{display:flex;justify-content:space-between;gap:1.6rem}
  .acol{font-size:1.3rem;width:auto!important;text-align:left}
  .acol .t{margin-bottom:2rem}.acol .grp+.grp{margin-top:2.4rem}.acol .n{margin-bottom:.6rem}
  #bio{width:auto;font-size:1.6rem;order:3}
  .srow{display:flex;justify-content:space-between;order:4}
  .stat{text-align:left!important}
  .stat .num{font-size:4.4rem}.stat .sl{font-size:1.2rem}
  #aport{order:5}
  .pbox{width:10rem;height:10rem}
  .contact{font-size:1.4rem}
  #asoc{order:6;flex-direction:row}
}
@media (max-width:760px){
  .pj-end{padding-top:8rem}
  .pj-next .row{flex-direction:column-reverse;align-items:flex-start}
  .pj-next .name{font-size:5.2rem;flex:none;width:100%}
  .pj-thumb{width:100%}
  .pj-foot{font-size:1.2rem;padding-top:4rem}
}
@media (max-width:760px) and (max-height:620px){
  #col{height:calc(100% - 4.4rem - 25rem - var(--wx,0rem))}
  .list{top:calc(100% - 23.6rem - var(--wx,0rem))}
  #hl{font-size:3.2rem}
}
</style>

<!-- NAV -->

<!-- HOME -->

  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="col" aria-label="Projects"></div>

  <div id="soc" class="soc-wrap">
    <a class="soc be" data-social="behance" href="#" target="_blank" rel="noopener" aria-label="Behance"><img data-src="images/icons/behance.svg" alt=""></a>

  </div>

  </div>

    <div class="lbl m"><span class="mi">Detail</span></div>
    <div class="dls"><div class="dl"></div><div class="dl"></div><div class="dl"></div><div class="dl"></div></div>
  </div>

  <h1 id="hl"><!-- nội dung phần này được điền từ content.json -->
    <div class="hl1 m"><span class="mi" data-c="hero.location"></span></div>
    <div class="hl2">
      <span class="m"><span class="mi" data-c="hero.firstName"></span></span>
      <span id="pill"><span class="av-wrap" id="pillAv"><img data-c-src="avatarPill" alt="" draggable="false"></span></span>
      <span class="m"><span class="mi" data-c="hero.lastName"></span></span>

    <div class="hl3" id="hlRole"></div>

</section>

<!-- ABOUT -->
<section class="page" id="about" aria-label="About">
  <i class="vl" style="left:60.7rem"></i><i class="vl" style="left:132.6rem"></i>

  <h2 id="aname" class="ab">
    <div class="m an1"><div class="mi" data-c="about.nameLine1"></div></div>
    <div class="m"><div class="mi"><span data-c="about.nameLine2"></span><i class="sq" id="aSq"></i></div></div>
  </h2>

  <div class="arow">
    <div class="acol ab" id="exp"></div>
    <div class="acol ab" id="cert"></div>
  </div>

  <p id="bio" class="ab" data-c="about.bio"></p>

  <div id="asoc" class="ab soc-wrap">
    <a class="soc be" data-social="behance" href="#" target="_blank" rel="noopener" aria-label="Behance"><img data-src="images/icons/behance.svg" alt=""></a>
    <a class="soc li" data-social="linkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn"><img data-src="images/icons/linkedin.svg" alt=""></a>
  </div>

  <div class="srow" id="stats"></div>

  <div id="aport" class="ab">
    <div class="pbox" id="pbox"><span class="av-wrap full" id="pboxAv"><img data-c-src="avatar" alt="" draggable="false"></span></div>
    <div class="contact" id="contact"></div>
  </div>
</section>

<!-- PROJECT — the client's frames as a stack of full-width images (renderProject inserts them before #pjEnd) -->
<section class="page" id="project" aria-label="Project">
  <div class="pj-scroll" id="pjScroll">
    <div class="pj-stack" id="pjStack">
      <div class="pj-end" id="pjEnd">
        <a class="pj-next" id="pjNext" href="/">
          <div class="top pj-lbl rv-text" data-rv><span class="m"><span class="mi">NEXT PROJECT</span></span><span class="m"><span class="mi" id="pjNextIdx"></span></span></div>
          <div class="row">
            <div class="name rv-text" data-rv id="pjNextName"></div>
            <div class="pj-thumb rv-img" data-rv><div class="rv-in"><img id="pjNextImg" alt="" draggable="false"></div></div>
          </div>
        </a>
        <footer class="pj-foot"><span data-c="footerLeft"></span><span data-c="site.title"></span></footer>
      </div>
    </div>
  </div>
</section>

<div id="xfer" aria-hidden="true"><img alt=""></div>

<!-- CURTAIN (loader + page transitions) -->
<div id="curtain">
  <div id="ld">
    <div id="ldRow">
      <div class="m"><div class="mi" id="ldNum">0%</div></div>
      <div class="m"><div class="mi" id="ldHandle" data-c="site.handle"></div></div>

    <div id="ldLine"><div id="ldFill"></div></div>

</div>

<div id="cur"><div class="cb"><span>DRAG/<br>CLICK</span></div></div>

<script>
/* =========================================================
   Toàn bộ chữ, link, ảnh nằm trong content.json (client sửa qua Pages CMS).
   File này chỉ chứa giao diện + hiệu ứng.
   ========================================================= */
function APP(C, T){
'use strict';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const get = (o, path) => path.split('.').reduce((v, k) => v == null ? v : v[k], o);
const str = v => v == null ? '' : String(v).trim();
C = C || {};
const SETTINGS = C.settings || {};
const TUNING = SETTINGS.tuningPanel !== false;   // bảng chỉnh hiệu ứng (phím G)

/* Ảnh thiếu / lỗi → ô xám có tên project, trang không bị vỡ */
const placeholderSrc = (label, w = 1240, h = 698) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="#e9e9ec"/>` +
  `<text x="50%" y="50%" fill="#a3a3ab" font-family="Arial,sans-serif" font-size="${Math.round(h / 12)}" font-weight="700" text-anchor="middle" dominant-baseline="middle">${esc(label)}</text></svg>`);
const isPH = src => /^data:image\/svg\+xml;charset=utf-8,/.test(src || '');
addEventListener('error', e => {
  const im = e.target;
  if (im && im.tagName === 'IMG' && !isPH(im.getAttribute('src'))) im.src = placeholderSrc(im.alt || 'Image');
}, true);

/* Project page = the client's Figma frames, stacked full-width (no layout template).
   card   ảnh ở trang chủ, 1240×698 (620:349)
   hero   frame 1 — the card grows into it (export 2880 wide; same crop as the card)
   pages  frames 2…n in order. Để trống → hiện số ô placeholder = placeholderPages. */
const slugify = t => str(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'project';
const MAX_PROJECTS = 6;   // bố cục thiết kế cho tối đa 6 dự án
const PROJECTS = (Array.isArray(C.projects) ? C.projects : []).filter(p => p && str(p.name) && p.hidden !== true).slice(0, MAX_PROJECTS).map(   // hidden: true → ẩn khỏi web
  (p, i, arr) => {
  const name = str(p.name);
  let slug = slugify(p.slug || name);
  if (arr.slice(0, i).some(q => slugify(q.slug || q.name) === slug)) slug += '-' + (i + 1);
  const d = Array.isArray(p.detail) ? p.detail : [p.year, p.type, p.platform, p.status];
  // ảnh chi tiết: chuỗi đường dẫn (repo) hoặc { src, srcset, w, h } (bản đã tối ưu do build.py tạo)
  const pages = (Array.isArray(p.pages) ? p.pages : []).map(g => (g && typeof g === 'object') ? g : { src: str(g) }).filter(g => str(g.src));
  const img = str(p.card) || placeholderSrc(name);
  return { name, slug, detail: [0, 1, 2, 3].map(k => str(d[k])), img, hero: str(p.hero) || img, heroW: +p.heroW || 0, heroH: +p.heroH || 0,
           pages: pages.length ? pages : Math.max(0, parseInt(p.placeholderPages, 10) || 3) };
});
/* mobile: mỗi dự án thứ 5, 6 đẩy danh sách Work + cột ảnh lên 1 dòng (2.5rem) để không đè tiêu đề */
document.documentElement.style.setProperty('--wx', (Math.max(0, PROJECTS.length - 4) * 2.5).toFixed(3) + 'rem');
if (!PROJECTS.length) PROJECTS.push({ name:'Project', slug:'project', detail:['','','',''], img: placeholderSrc('Project'), hero: placeholderSrc('Project'), pages: 3 });

/* Ảnh pill đổi vòng tròn (hero.pillImages) */
let PILL_SEQ = [], PILL_EVERY = 2;

/* Điền chữ / link / ảnh vào HTML */
(function applyContent(){
  const site = C.site || {}, hero = C.hero || {}, about = C.about || {}, soc = C.socials || {}, ct = about.contact || {};
  const V = Object.assign({}, C, {
    navYear: site.year ? '@' + str(site.year) : '',
    footerLeft: [site.year ? '@' + str(site.year) : '', str(site.name)].filter(Boolean).join(' — '),
  });
  document.querySelectorAll('[data-c]').forEach(el => { el.textContent = str(get(V, el.dataset.c)); });
  const avatar = str(hero.avatar) || placeholderSrc(site.name || 'Avatar', 600, 600);
  const pills = (Array.isArray(hero.pillImages) ? hero.pillImages : []).map(str).filter(Boolean);
  const imgs = { avatar, avatarPill: pills[0] || str(hero.avatarPill) || avatar };
  PILL_SEQ = pills.length > 1 ? pills : [];
  PILL_EVERY = Math.max(1, parseFloat(hero.pillInterval) || 2);
  document.querySelectorAll('img[data-src]').forEach(im => { im.src = im.dataset.src; });   // đặt src sau khi có <base>
  document.querySelectorAll('[data-c-src]').forEach(el => { el.src = imgs[el.dataset.cSrc]; el.alt = str(site.name); });
  // role: "PRODUCT DESIGNER" → mỗi từ 1 khối, ô vuông hồng sau từ cuối
  const words = str(hero.role).split(/\s+/).filter(Boolean);
  document.getElementById('hlRole').innerHTML = words.map((w, i) =>
    `<span class="m"><span class="mi">${esc(w)}${i === words.length - 1 ? '<i class="sq" id="hlSq"></i>' : ''}</span></span>`).join('');
  // experience / certificate
  const grp = (title, list, a, b, c) => `<div class="m t"><span class="mi">${esc(title)}</span></div>` +
    (Array.isArray(list) ? list : []).map(x => `<div class="grp"><div class="m n"><span class="mi">${esc(x[a])}</span></div><div class="m"><span class="mi">${esc(x[b])}</span></div><div class="m d"><span class="mi">${esc(x[c])}</span></div></div>`).join('');
  document.getElementById('exp').innerHTML = grp(about.experienceTitle || 'EXPERIENCE', about.experience, 'company', 'role', 'time');
  document.getElementById('cert').innerHTML = grp(about.certificatesTitle || 'CERTIFICATE', about.certificates, 'org', 'title', 'note');
  // stats (bố cục có đúng 3 vị trí)
  document.getElementById('stats').innerHTML = (Array.isArray(about.stats) ? about.stats : []).slice(0, 3).map((x, i) => {
    const v = parseFloat(x.value) || 0;
    return `<div class="stat ab" id="st${i + 1}"><div class="m"><div class="mi num"><span data-to="${v}">${v}</span><i>${esc(x.suffix)}</i></div></div><div class="m"><div class="mi sl">${esc(x.label)}</div></div></div>`;
  }).join('');
  // contact
  const email = str(ct.email), phone = str(ct.phone);
  const tel = str(ct.phoneLink) || (phone ? 'tel:' + phone.replace(/\(.*?\)/g, '').replace(/[^\d+]/g, '') : '');
  const row = (txt, dim, href) => txt ? `<div class="m${dim ? ' dim' : ''}"><span class="mi">${href ? `<a href="${esc(href)}"${/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ''}>${esc(txt)}</a>` : esc(txt)}</span></div>` : '';
  document.getElementById('contact').innerHTML = row(str(ct.birthday), true) + row(email, false, email ? 'mailto:' + email : '') + row(str(ct.location), true) + row(phone, false, tel);
  // socials: link trống → ẩn icon
  document.querySelectorAll('[data-social]').forEach(a => {
    const u = str(soc[a.dataset.social]);
    if (u) a.href = u; else a.style.display = 'none';
  });
  const md = document.querySelector('meta[name="description"]'); if (md) md.content = str((C.seo || {}).description);
})();

const N = PROJECTS.length;

/* =========================================================
   MOTION CORE — one bezier drives CSS, WAAPI and JS tweens
   ========================================================= */
const EASES = {
  signature: { label:'Signature (.62, .05, .01, .99)', v:[.62,.05,.01,.99] },
  quart:     { label:'Quart in-out (.76, 0, .24, 1)',  v:[.76,0,.24,1] },

let EASE = '', bez = t => t, easeKey = 'signature';

function makeBezier(x1, y1, x2, y2){
  const cx = 3*x1, bx = 3*(x2-x1)-cx, ax = 1-cx-bx;
  const cy = 3*y1, by = 3*(y2-y1)-cy, ay = 1-cy-by;
  const X = t => ((ax*t+bx)*t+cx)*t, Y = t => ((ay*t+by)*t+cy)*t, dX = t => (3*ax*t+2*bx)*t+cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++){ const e = X(t)-x; if (Math.abs(e) < 1e-6) return Y(t); const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= e/d; }

    for (let i = 0; i < 30; i++){ const v = X(t); if (Math.abs(v-x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo+hi)/2; }
    return Y(t);
  };
}
function setEase(k){

}
/* the same bezier, entered at its fastest point → starts at top speed, then settles */
let easeOut = t => t;
function buildEaseOut(){

  for (let i = 1; i < 400; i++){ const t = i / 400, d = bez(Math.min(1, t + .001)) - bez(Math.max(0, t - .001)); if (d > best){ best = d; t0 = t; } }

}
const easeOutTimeAt = p => { for (let i = 0; i <= 400; i++) if (easeOut(i / 400) >= p) return i / 400; return 1; };
function setSpeed(s){ SPEED = s; root.style.setProperty('--speed', s); }

const ms = s => s * 1000 * SPEED;
const wait = s => new Promise(r => setTimeout(r, ms(s)));
/* WAAPI helper. end:{...} = styles committed when finished; keep:true = hold last frame */
function A(el, kf, d = .9, delay = 0, o = {}){

  const a = el.animate(kf, { duration: ms(d), delay: ms(delay), easing: EASE, fill: 'both', ...rest });

}

/* rAF tween using the same bezier */
function tween({ from = 0, to = 1, d = 1, delay = 0, onUpdate, ease }){
  let raf, done = false, resolve; const p = new Promise(r => resolve = r);
  const dur = Math.max(1, ms(d)), t0 = performance.now() + ms(delay);
  const step = now => {
    if (done) return;

  return { p, cancel(){ if (!done){ done = true; cancelAnimationFrame(raf); resolve(false); } } };
}

const S = { bv: 0, mode: 'auto', hoverK: -1, x: START_INDEX, tx: START_INDEX, px: START_INDEX, tw: null, drag: false, pd: null, eff: 0, active: -1, needSnap: false, lastInput: 0, justDragged: false, back: START_INDEX };

function measure(){

/* =========================================================
   HOME — infinite column, scrubbed Work list, rolling Detail
   ========================================================= */
function layoutCards(){
  const M = cards.length, { H, cy, colH } = G, pitch = G.P;
  const sc = 1 - S.eff * P.squeeze;
  for (let i = 0; i < M; i++){
    const c = cards[i];
    const rel = mod(c.k - S.x + M / 2, M) - M / 2;          // distance from centre, in cards
    const y = cy + rel * pitch - H / 2;
    const vis = y > -H - 40 && y < colH + 40;
    if (vis !== c.vis){ c.el.style.visibility = vis ? '' : 'hidden'; c.vis = vis; }
    if (!vis) continue;
    c.rel = rel;
    c.el.style.transform = `translate3d(0,${y.toFixed(2)}px,0) scale(${sc.toFixed(4)})`;
    // focus: the centred card shows its full, un-cropped image; neighbours zoom in + parallax
    const r = Math.max(-1.2, Math.min(1.2, rel)), a = Math.min(1, Math.abs(r));
    const mScale = 1 + P.focusZoom * a + S.eff * .05;
    c.y = y; c.sc = sc; c.mScale = mScale; c.off = -r * P.parallax;
    // mobile: card đang active rõ 100%, card khác mờ 70% (theo khoảng cách tới giữa)
    const alpha = TOUCH_UI.matches ? 1 - .3 * a : 1;
    c.alpha = alpha;
    const op = alpha === 1 ? '' : alpha.toFixed(3);
    if (c.el.style.opacity !== op) c.el.style.opacity = op;
    if (!glOn) c.media.style.transform = `translate3d(0,${(-r * H * P.parallax).toFixed(2)}px,0) scale(${mScale.toFixed(4)})`;

}
const smooth = t => t * t * (3 - 2 * t);
function updateWork(){
  const f = mod(S.x, N);
  for (let j = 0; j < N; j++){
    let d = Math.abs(f - j); d = Math.min(d, N - d);
    const w = 1 - smooth(Math.min(1, d));
    const o = wItems[j];
    if (Math.abs(w - o.w) > .002){
      o.w = w;
      o.el.style.opacity = (.2 + .8 * w).toFixed(3);
      o.el.style.transform = `translateX(${(G.wdir * w * G.rem * .6).toFixed(2)}px)`;
    }
  }
  // travelling pink square (two copies handle the wrap-around)
  const ys = G.wy, pitch = ys[1] - ys[0];
  const rot = mod(f, 1) * 90;
  if (f <= N - 1){
    const j = Math.floor(f), t = f - j, y = ys[j] + (ys[Math.min(j + 1, N - 1)] - ys[j]) * t;
    wm[0].style.transform = `translateY(${y}px) rotate(${rot}deg)`; wm[0].style.opacity = S.wmOn;
    wm[1].style.opacity = 0;
  } else {
    const t = f - (N - 1);
    wm[0].style.transform = `translateY(${ys[N - 1] + t * pitch}px) rotate(${rot}deg)`; wm[0].style.opacity = (1 - t) * S.wmOn;
    wm[1].style.transform = `translateY(${ys[0] - (1 - t) * pitch}px) rotate(${rot}deg)`; wm[1].style.opacity = t * S.wmOn;
  }
}

function roll(dl, text, dir, delay){
  const cur = dl.querySelector('.dv:not(.out)');
  if (cur && cur.dataset.t === text) return;
  const D = .75;
  if (cur){
    cur.classList.add('out');
    cur.getAnimations().forEach(a => { try { a.commitStyles(); } catch (e) {} a.cancel(); });
    cur.animate([{ transform:`translateY(${-dir * 110}%)` }], { duration: ms(D), delay: ms(delay), easing: EASE, fill:'forwards' });
    setTimeout(() => cur.remove(), ms(D + delay) + 60);
  }
  const nv = document.createElement('span');
  nv.className = 'dv'; nv.dataset.t = text; nv.textContent = text;
  dl.appendChild(nv);
  nv.animate([{ transform:`translateY(${dir * 110}%)` }, { transform:'translateY(0)' }], { duration: ms(D), delay: ms(delay), easing: EASE, fill:'backwards' });
}

}

  up($$('#work .mi, #detail .lbl .mi'), .9, .4, .045);
  S.wmOn = 0; tween({ from: 0, to: 1, d: .6, delay: 1.1, onUpdate: v => S.wmOn = v });
  // reel-spin: already at top speed on the first frame, decelerates into place.
  // Work highlight + Detail roll ride along with the scroll.
  const dest = first ? START_INDEX : S.back;
  const dist = RM ? 0 : (first ? N * 1.5 : 2), spinD = first ? 2.6 : 1.8;
  const from = dest - dist;
  S.x = S.tx = S.px = from; S.active = -1; S.needSnap = false;
  dls.forEach(dl => dl.innerHTML = '');
  S.mode = 'auto';
  const tw = tween({ from, to: dest, d: spinD, ease: easeOut, onUpdate: v => { S.x = S.tx = v; } });
  S.tw = tw; tw.p.then(() => { if (S.tw === tw) S.tw = null; });
  // avatar pill opens once the reel has settled
  const pillAt = RM ? 0 : spinD * easeOutTimeAt(PILL_AT);
  const pill = $('#pill'), pw = pill.getBoundingClientRect().width + 'px';
  const gap = getComputedStyle($('.hl2')).columnGap;
  A(pill, [{ width:'0px', marginLeft:`-${gap}` }, { width: pw, marginLeft:'0px' }], 1.1, pillAt);
  A($('#pillAv'), [{ transform:'scale(1.6) translateY(20%)' }, { transform:'none' }], 1.2, pillAt + .05);
}
function countUp(el, delay){

function introAbout(){

  $$('#about .vl').forEach((e, i) => A(e, [{ transform:'scaleY(0)' }, { transform:'scaleY(1)' }], 1.4, .1 + i * .12));
  up($$('#exp .mi'), .9, .35, .035);
  up($$('#cert .mi'), .9, .45, .035);
  up($$('#bio .mi'), .9, .45, .01);
  $$('#asoc .soc').forEach((e, i) => A(e, [{ transform:'scale(0)' }, { transform:'none' }], .8, .55 + i * .08));
  A($('#pbox'), [{ clipPath:'inset(100% 0 0 0)' }, { clipPath:'inset(0% 0 0 0)' }], 1.1, .35);

  up($$('.contact .mi'), .9, .5, .05);

/* =========================================================
   NAVIGATION
   · curtain (up → label → down) between pages
   · shared element: the centred card grows into the project hero, and back
   ========================================================= */
const curtain = $('#curtain'), clabel = $('#clabelTxt');
const pjPage = $('#project'), pjScroll = $('#pjScroll'), pjStack = $('#pjStack'), pjEnd = $('#pjEnd'), glCanvas = $('#gl');
/* Lenis smooth scroll cho trang chi tiết dự án (chỉ con lăn chuột/trackpad; cảm ứng giữ cuộn gốc của máy) */
const pjLenis = (window.Lenis && !RM) ? new Lenis({ wrapper: pjScroll, content: pjStack, autoRaf: true, lerp: .09, wheelMultiplier: 1, smoothWheel: true }) : null;
const xfer = $('#xfer'), xferImg = $('#xfer img');
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const untilIdle = async () => { while (busy) await new Promise(r => setTimeout(r, 50)); };
const hoverVal = (c, now = performance.now()) => c.hT == null ? (c.hB || 0) : c.hA + (c.hB - c.hA) * bez(Math.min(1, (now - c.hT) / ms(1)));
function nearestIdx(j, base){ let diff = mod(j - mod(base, N), N); if (diff > N / 2) diff -= N; return base + diff; }
const rectKF = r => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });

function navigate(r, { push = true, src = null } = {}){
  if (busy) return;
  if (r.page === 'project'){
    if (current === 'project' && r.i === projectIdx) return;
    if (src && (current === 'home' || current === 'project')) return openProject(r.i, src, { push });
    return go(r, { push });
  }
  if (r.page === current) return;
  if (r.page === 'home' && current === 'project') return closeProject({ push });
  return go(r, { push });
}

function reveal(to, first){
  $$('.page').forEach(p => p.classList.toggle('on', p.id === to));
  document.body.classList.toggle('on-project', to === 'project');
  A(curtain, [{ transform:'translateY(0)' }, { transform:'translateY(100%)' }], 1.2, 0, { end:{ transform:'translateY(100%)' } });
  if (to === 'home'){ resetHomeOut(); introHome(first); }
  else if (to === 'about') introAbout();
  else introProject(false);
}

/* curtain transition — any page to any page */
async function go(r, { push = true } = {}){
  if (busy) return;
  busy = true;
  const to = r.page;
  if (push) pushRoute(r);
  const from = $('#' + current), D = 1.1;
  placeNavMarker(true, navKey(to));
  if (gui) gui.show(false);
  if (current === 'home'){
    S.back = Math.round(S.tx);                                  // remember where we were
    if (S.tw) S.tw.cancel();
    S.mode = 'auto'; const x0 = S.x; S.tw = tween({ from: x0, to: x0 + 1.4, d: D, onUpdate: v => { S.x = S.tx = v; } }); // column whooshes away
  }
  if (current === 'project' && to === 'home') S.back = nearestIdx(projectIdx, S.back);   // land on the project we came from
  A(from, [{ transform:'translateY(0)' }, { transform:'translateY(-10vh)' }], D, 0, { keep: true });
  A(curtain, [{ transform:'translateY(100%)' }, { transform:'translateY(0)' }], D, 0, { end:{ transform:'translateY(0)' } });
  clabel.textContent = (to === 'project' ? PROJECTS[r.i].name : to).toUpperCase();
  await wait(D * .9);
  A(clabel, [{ transform:'translateY(110%)' }, { transform:'translateY(0)' }], .8, 0, { end:{ transform:'translateY(0)' } });
  await wait(1);
  from.getAnimations().forEach(a => a.cancel());
  pjScroll.getAnimations().forEach(a => a.cancel());
  if (S.tw){ S.tw.cancel(); S.tw = null; }
  current = to;
  if (to === 'project') renderProject(r.i);
  A(clabel, [{ transform:'translateY(0)' }, { transform:'translateY(-110%)' }], .7, 0, { end:{ transform:'translateY(110%)' } });
  await wait(.3);
  if (to === 'home') S.x = S.tx = S.back;
  reveal(to, false);
  await wait(1.2);
  busy = false;
  syncGui();
}

/* ---------- Home UI out / back (for the shared-element transition) ---------- */
const HOME_OUT = [];
function homeOut(){
  $$('#hl .mi').forEach((e, i) => HOME_OUT.push(A(e, [{ transform:'translateY(0)' }, { transform:'translateY(110%)' }], .8, i * .03, { keep: true })));
  HOME_OUT.push(A($('#pill'), [{ opacity: 1 }, { opacity: 0 }], .5, 0, { keep: true }));
  [$('#work'), $('#detail'), $('#soc')].forEach((e, i) =>
    HOME_OUT.push(A(e, [{ opacity: 1, transform:'translateY(0)' }, { opacity: 0, transform:'translateY(3rem)' }], .7, i * .05, { keep: true })));
  [col, glCanvas].forEach(e => HOME_OUT.push(A(e, [{ opacity: 1 }, { opacity: 0 }], .6, .15, { keep: true })));
}
function resetHomeOut(){ HOME_OUT.splice(0).forEach(a => a && a.cancel()); }
function introHomeReturn(delay){
  up($$('#hl .mi'), 1, delay, .05);
  A($('#pill'), [{ opacity: 0 }, { opacity: 1 }], .7, delay + .35);
  [$('#work'), $('#detail'), $('#soc')].forEach((e, i) =>
    A(e, [{ opacity: 0, transform:'translateY(3rem)' }, { opacity: 1, transform:'translateY(0)' }], .9, delay + .15 + i * .06));
}

/* ---------- hero images: decoded up front so the grow never waits ---------- */
const heroSrc = i => PROJECTS[i].hero || PROJECTS[i].img;
const HERO = PROJECTS.map((p, i) => { const im = new Image(); im.decoding = 'async'; im.src = heroSrc(i); return im; });
const heroRatio = i => HERO[i].naturalWidth ? HERO[i].naturalWidth / HERO[i].naturalHeight : (PROJECTS[i].heroW && PROJECTS[i].heroH ? PROJECTS[i].heroW / PROJECTS[i].heroH : 16 / 9);
const heroRect = i => { const W = pjScroll.clientWidth || pjPage.clientWidth; return { left: 0, top: 0, width: W, height: W / heroRatio(i) }; };

/* ---------- thumbnail → frame 1 of the project ---------- */
async function openProject(i, src, { push = true } = {}){
  busy = true;
  const fromHome = current === 'home';
  if (push) pushRoute({ page:'project', i });
  if (gui) gui.show(false);
  xferImg.src = heroSrc(i);
  try { await xferImg.decode(); } catch (e) { /* draw anyway */ }
  const r = src.getBoundingClientRect();
  let zoom = 1;
  if (fromHome){
    const c = cards[+src.dataset.k];
    if (c) zoom = (c.mScale || 1) * (1 + P.hoverZoom * hoverVal(c));   // match the card exactly
    S.back = Math.round(S.tx);
    homeOut();
  } else {
    if (src.matches(':hover')) zoom = 1.05;                           // next-project thumb is zoomed on hover
    A(pjScroll, [{ opacity: 1 }, { opacity: 0 }], .5, 0, { keep: true });
  }
  xferImg.style.transform = `scale(${zoom})`;
  Object.assign(xfer.style, { display:'block', opacity:'1', clipPath:'', ...rectKF(r) });
  const full = rectKF(heroRect(i)), d = 1.25;
  A(xfer, [rectKF(r), full], d, .05, { end: full });
  A(xferImg, [{ transform:`scale(${zoom})` }, { transform:'scale(1)' }], d, .05, { end:{ transform:'scale(1)' } });
  await wait(d + .08);

  // swap pages under the overlay — frame 1 sits exactly where the overlay is
  renderProject(i);
  pjScroll.getAnimations().forEach(a => a.cancel());
  $$('.page').forEach(pg => pg.classList.toggle('on', pg.id === 'project'));
  document.body.classList.add('on-project');
  current = 'project';
  introProject(true);
  const hi = frames[0] && frames[0].querySelector('img');
  if (hi){ try { await hi.decode(); } catch (e) {} }
  await nextFrame();
  xfer.style.display = 'none';
  await wait(.3);
  busy = false;
}

/* ---------- frame 1 → back into its card (curtain once it's mostly scrolled away) ---------- */
async function closeProject({ push = true } = {}){
  const f0 = frames[0];
  if (!f0 || pjScroll.scrollTop > f0.offsetHeight * .5) return go({ page:'home' }, { push });
  busy = true;
  if (push) pushRoute({ page:'home' });
  const i = projectIdx;
  const start = rectKF(f0.getBoundingClientRect());                  // frame 1 where it is now (maybe scrolled up a bit)
  xferImg.src = heroSrc(i);
  xferImg.style.transform = 'none';
  Object.assign(xfer.style, { display:'block', opacity:'1', clipPath:'', ...start });

  // home underneath, centred on this project
  resetHomeOut();
  if (S.tw){ S.tw.cancel(); S.tw = null; }
  S.x = S.tx = S.px = nearestIdx(i, S.back); S.needSnap = false; S.bv = 0; S.eff = 0; S.mode = 'auto';
  current = 'home';
  $$('.page').forEach(pg => pg.classList.toggle('on', pg.id === 'home'));
  document.body.classList.remove('on-project');
  layoutCards(); updateWork(); checkActive();
  const c = cards.reduce((b, c) => (c.vis && c.rel != null && (!b || Math.abs(c.rel) < Math.abs(b.rel))) ? c : b, null);
  const target = rectKF(c.el.getBoundingClientRect()), d = 1.15;
  A(xfer, [start, target], d, 0, { end: target });
  [col, glCanvas].forEach(e => A(e, [{ opacity: 0 }, { opacity: 1 }], .45, d * .72));
  introHomeReturn(.25);
  await wait(d + .02);
  xfer.style.display = 'none';
  busy = false;
  syncGui();
}

/* =========================================================
   PROJECT PAGE — frame 1 (hero) + the client's frames,
   full-width, one under another, normal scroll.
   ========================================================= */
const pad2 = n => String(n).padStart(2, '0');
/* Tên "Next project" dài: thu nhỏ cỡ chữ để không từ nào tràn và tối đa 2 dòng (không đẩy ảnh ra ngoài) */
function fitNextName(){
  const el = document.getElementById('pjNextName'); if (!el) return;
  el.style.fontSize = '';
  let size = parseFloat(getComputedStyle(el).fontSize), lh = parseFloat(getComputedStyle(el).lineHeight) / size || 1;
  const min = size * .35, words = [...el.querySelectorAll('.m')];
  const tooBig = () => el.clientWidth > 0 && (words.some(w => w.offsetWidth > el.clientWidth + 1) || el.scrollHeight > size * lh * 2.4);
  for (let i = 0; i < 40 && size > min && tooBig(); i++){ size *= .93; el.style.fontSize = size + 'px'; }
}
addEventListener('resize', () => requestAnimationFrame(fitNextName));
const wordMasks = t => t.split(' ').map(w => `<span class="m"><span class="mi">${esc(w)}</span></span>`).join(' ');
let frames = [];

const rvObs = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target;
    rvObs.unobserve(el);
    if (el.classList.contains('rv-img')){
      const box = el.querySelector('.rv-in');
      A(box, [{ clipPath:'inset(100% 0 0 0)' }, { clipPath:'inset(0% 0 0 0)' }], 1.2, 0, { end:{ clipPath:'inset(0% 0 0 0)' } });
      const inner = box.querySelector('img');
      if (inner) A(inner, [{ transform:'scale(1.25)' }, { transform:'scale(1)' }], 1.4, 0);
    } else {
      $$('.mi', el).forEach((m, k) => A(m, [{ transform:'translateY(110%)' }, { transform:'translateY(0)' }], 1, k * .04, { end:{ transform:'translateY(0)' } }));
    }
  });
}, { root: pjScroll, threshold: .12 });

/* pages: number → placeholders · 'src' · { src, w, h } · { w, h } (placeholder) */
function pageList(p){
  const pg = p.pages == null ? 3 : p.pages;
  const arr = typeof pg === 'number' ? Array.from({ length: pg }, () => ({ w: 1920, h: 1080 })) : pg;
  return arr.map(g => typeof g === 'string' ? { src: g } : { ...g, ratio: g.w && g.h ? g.w / g.h : 0 });
}

let preObs = null;
function renderProject(i){
  projectIdx = i;
  const p = PROJECTS[i], ni = (i + 1) % N, nx = PROJECTS[ni];
  const list = [{ src: heroSrc(i), ratio: (HERO[i].naturalWidth || p.heroW) ? heroRatio(i) : 0 }, ...pageList(p)];
  const total = list.length;
  frames.forEach(f => f.remove());
  frames = list.map((g, j) => {
    const f = document.createElement('figure');
    const lbl = `${pad2(j + 1)} / ${pad2(total)}`;
    f.className = 'pj-f' + (j ? '' : ' is-hero') + (g.ratio ? ' is-fixed' : '');
    if (g.ratio) f.style.aspectRatio = String(g.ratio);
    f.innerHTML = '<div class="pj-fi">' + (g.src
      ? `<img src="${esc(g.src)}"${g.srcset ? ` srcset="${esc(g.srcset)}" sizes="100vw"` : ''}${g.w && g.h ? ` width="${g.w}" height="${g.h}"` : ''} alt="${esc(p.name)} — ${lbl}" draggable="false" decoding="async"${j > 2 ? ' loading="lazy"' : j ? ' fetchpriority="low"' : ' fetchpriority="high"'}>`
      : `<div class="pj-ph"><i class="ph-sq"></i><span class="ph-lbl">${esc(p.name)} — ${lbl}</span><span class="ph-sz">${g.w} × ${g.h}</span></div>`)
      + '</div>';
    pjStack.insertBefore(f, pjEnd);
    return f;
  });
  // tải trước: khi một frame gần tới màn hình, 3 frame kế tiếp chuyển sang tải ngay (không chờ lazy)
  if (preObs) preObs.disconnect();
  preObs = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const k = frames.indexOf(e.target);
    frames.slice(k, k + 4).forEach(fr => { const im = fr.querySelector('img[loading="lazy"]'); if (im) im.loading = 'eager'; });
    preObs.unobserve(e.target);
  }), { root: pjScroll, rootMargin: '150% 0px' });
  frames.forEach(fr => preObs.observe(fr));
  $('#pjNextName').innerHTML = wordMasks(nx.name);
  fitNextName();
  $('#pjNextIdx').textContent = `(${pad2(ni + 1)}/${pad2(N)})`;
  $('#pjNextImg').src = nx.img; $('#pjNextImg').alt = nx.name;
  $('#pjNext').href = hrefFor({ page:'project', i: ni });
  // fresh scroll + reveal state
  if (pjLenis) pjLenis.scrollTo(0, { immediate: true, force: true });
  pjScroll.scrollTop = 0;
  $$('[data-rv]', pjPage).forEach(el => {
    el.getAnimations({ subtree: true }).forEach(a => a.cancel());
    $$('.rv-in', el).forEach(b => (b.style.clipPath = ''));
    $$('.mi', el).forEach(m => (m.style.transform = ''));
    rvObs.unobserve(el); rvObs.observe(el);
  });
}

function introProject(fromExpand){
  const d0 = fromExpand ? 0 : .25;
  if (!fromExpand && frames[0]) A(frames[0].querySelector('img'), [{ transform:'scale(1.15)' }, { transform:'scale(1)' }], 1.6, 0);
  up([$('#navBack .mi')], .8, d0 + .2);
  // frames already on screen under frame 1 (portrait screens) rise in behind it
  const H = pjScroll.clientHeight;
  frames.slice(1).filter(f => f.getBoundingClientRect().top < H).forEach((f, k) =>
    A(f.firstElementChild, [{ transform:'translateY(25%)', opacity: 0 }, { transform:'translateY(0)', opacity: 1 }], 1.1, d0 + .15 + k * .08));
}

$('#pjNext').addEventListener('click', e => {
  e.preventDefault();
  navigate({ page:'project', i: (projectIdx + 1) % N }, { src: $('#pjNext .pj-thumb') });
});

/* browser back / forward */
addEventListener('popstate', async () => {
  await untilIdle();
  const r = parseRoute();
  document.title = titleFor(r);
  navigate(r, { push: false });
});

/* =========================================================
   CURSOR
   ========================================================= */
const curEl = $('#cur'), curLbl = $('#cur .cb span');
const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
let mx = -200, my = -200, cxp = -200, cyp = -200;
if (fine){
  document.body.classList.add('cursor-on');
  addEventListener('pointermove', e => { if (e.pointerType === 'mouse'){ mx = e.clientX; my = e.clientY; } }, { passive: true });
  addEventListener('pointerover', e => {
    const t = e.target;
    const onNext = !!t.closest('.pj-next');
    curEl.classList.toggle('is-card', !!t.closest('.card') || onNext);
    curLbl.innerHTML = onNext ? 'NEXT' : 'DRAG/<br>CLICK';
    curEl.classList.toggle('is-link', !t.closest('.card') && !!t.closest('a,button,[data-go],label'));
    curEl.classList.toggle('is-off', !!t.closest('.lil-gui'));
  });
  document.addEventListener('pointerleave', () => { mx = my = -200; });
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(4, (now - last) / 16.667); last = now;
  if (current === 'home' && home.classList.contains('on')){
    if (!S.tw){
      const k = S.drag ? .4 : P.lerp, a = 1 - Math.pow(1 - k, dt);
      S.x += (S.tx - S.x) * a; if (Math.abs(S.tx - S.x) < 1e-5) S.x = S.tx;
    }
    // rest-snap: only after the scroll has come to rest, then ease into place
    if (S.needSnap && !S.tw && !S.drag && P.snap){
      const idle = (now - S.lastInput) / 1000, settled = Math.abs(S.tx - S.x) < .03;
      if ((idle >= P.snapIdle && settled) || idle >= P.snapIdle + .2){
        S.needSnap = false;
        const dest = Math.round(S.x), dist = Math.abs(dest - S.x);
        S.tx = S.x;
        if (dist > .002){
          const tw = tween({ from: S.x, to: dest, d: P.snapDur + .2 * dist, onUpdate: v => { S.x = S.tx = v; } });
          S.tw = tw; tw.p.then(() => { if (S.tw === tw) S.tw = null; });
        } else S.x = S.tx = dest;
      }
    }
    const vs = (S.x - S.px) * G.P / dt, v = Math.abs(vs); S.px = S.x;   // px/frame, + = column moving up
    S.eff += (Math.min(1, v / 50) - S.eff) * (1 - Math.pow(.86, dt));
    if (RM) S.eff = 0;
    // bend follows scroll speed + direction; relaxes to flat when the column slows
    // user scroll: bend only while input is live, then flatten (snap/coast stay flat)
    const live = S.mode !== 'user' || (now - S.lastInput) < P.hold;
    const target = (RM || !P.bendOn || !live) ? 0 : Math.max(-P.maxBend, Math.min(P.maxBend, vs / (G.rem / 10) / P.speedForMax));
    const building = Math.abs(target) > Math.abs(S.bv) && (S.bv === 0 || Math.sign(target) === Math.sign(S.bv));
    const T = Math.max(1, building ? P.attack : P.flatten);
    S.bv += (target - S.bv) * (1 - Math.exp(-3 * dt * 16.667 / T));
    if (Math.abs(S.bv) < 1e-4) S.bv = 0;
    mon.bend = S.bv;
    layoutCards(); updateWork(); checkActive();
    if (glOn) GL.render(now);
  }
  if (fine){
    const a = 1 - Math.pow(1 - .22, dt);
    cxp += (mx - cxp) * a; cyp += (my - cyp) * a;
    curEl.style.transform = `translate3d(${cxp.toFixed(1)}px,${cyp.toFixed(1)}px,0)`;
  }
  requestAnimationFrame(frame);
}

/* =========================================================
   WEBGL BEND — each card is a subdivided plane; the middle column of the
   plane leads along the scroll direction and pushes through Z (perspective).
   Mechanism from leonsayer.framer.website, rotated for a vertical column.
   ========================================================= */
const mon = { bend: 0 };
let glOn = false;
const GL = (() => {
  const canvas = $('#gl');
  let gl = null;
  try { gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: true }); } catch (e) {}
  if (!gl) return { init(){}, render(){}, resize(){} };
  const VS = `#version 300 es
  in vec2 aPos;
  uniform mat4 uPV;
  uniform vec3 uCenter;
  uniform vec2 uSize;
  uniform float uBend;      // velocity(-1..1) * strength, px
  uniform float uLead;
  uniform float uDepthMode; // 0 signed · 1 recede · 2 bulge
  out vec2 vUv;
  void main(){
    vUv = vec2(aPos.x + .5, .5 - aPos.y);
    float xn = aPos.x * 2.0;
    float arch = max(0.0, 1.0 - xn * xn);           // 0 at left/right edges, 1 in the middle
    vec3 p = vec3(aPos * uSize, 0.0);
    p.y += uBend * uLead * arch;                     // middle leads along the scroll
    float dz = uDepthMode < .5 ? -uBend : (uDepthMode < 1.5 ? -abs(uBend) : abs(uBend));
    p.z += dz * arch;                                // and moves through depth
    gl_Position = uPV * vec4(p + uCenter, 1.0);
  }`;
  const FS = `#version 300 es
  precision highp float;
  in vec2 vUv;
  uniform sampler2D uTex;
  uniform vec2 uSize, uImg, uOff;
  uniform float uZoom, uRadius, uAlpha;
  out vec4 o;
  void main(){
    float pa = uSize.x / uSize.y, ia = uImg.x / uImg.y;
    vec2 ratio = pa > ia ? vec2(1.0, ia / pa) : vec2(pa / ia, 1.0);   // cover fit
    vec2 c = vUv - .5;
    vec2 uv = (c - uOff) / uZoom * ratio + .5;                         // focus zoom + parallax
    vec4 col = texture(uTex, uv);
    vec2 q = abs(c * uSize) - (uSize * .5 - uRadius);
    float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - uRadius;
    float a = clamp(.5 - d, 0.0, 1.0);
    a *= uAlpha;
    o = vec4(col.rgb * a, a);
  }`;
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  let prog, U = {}, vao, count = 0;
  const tex = [], imgSize = [];
  function geometry(sx = 48, sy = 4){
    const pos = [], idx = [];
    for (let j = 0; j <= sy; j++) for (let i = 0; i <= sx; i++) pos.push(i / sx - .5, .5 - j / sy);
    for (let j = 0; j < sy; j++) for (let i = 0; i < sx; i++){ const a = j * (sx + 1) + i, b = a + 1, c = a + sx + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
    count = idx.length;
  }
  function loadTex(i, src){
    return new Promise((res, rej) => {
      const im = new Image(); im.decoding = 'async';
      im.onload = () => {
        const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        tex[i] = t; imgSize[i] = [im.naturalWidth, im.naturalHeight]; res();
      };
      im.onerror = () => { if (!isPH(im.src)) im.src = placeholderSrc(PROJECTS[i] ? PROJECTS[i].name : 'Image'); else rej(); };
      im.src = src;
    });
  }
  let W = 1, Hh = 1, dpr = 1;
  function resize(){
    dpr = Math.min(2, devicePixelRatio || 1);
    W = home.clientWidth; Hh = home.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(Hh * dpr);
  }
  function persp(fov, aspect, near, far){
    const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
    return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
  }
  async function init(){
    try {
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      ['uPV','uCenter','uSize','uBend','uLead','uDepthMode','uTex','uImg','uOff','uZoom','uRadius','uAlpha'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
      geometry();
      await Promise.all(PROJECTS.map((p, i) => loadTex(i, p.img)));
      resize(); glOn = true; document.body.classList.add('gl-on');
    } catch (e) { console.warn('WebGL bend disabled:', e); }
  }
  function render(now){
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog); gl.bindVertexArray(vao);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    const fov = P.fov * Math.PI / 180, D = (Hh / 2) / Math.tan(fov / 2);
    const pr = persp(fov, W / Hh, D * .05, D * 4);
    pr[14] += pr[10] * -D; pr[15] += pr[11] * -D;                 // × translate(0,0,-D)
    gl.uniformMatrix4fv(U.uPV, false, pr);
    const u10 = G.rem / 10;
    gl.uniform1f(U.uBend, S.bv * P.strength * u10);
    gl.uniform1f(U.uLead, P.lead);
    gl.uniform1f(U.uDepthMode, P.depthMode === 'recede' ? 1 : P.depthMode === 'bulge' ? 2 : 0);
    gl.uniform1f(U.uRadius, P.radius * u10);
    gl.uniform1i(U.uTex, 0); gl.activeTexture(gl.TEXTURE0);
    // clip to the column (a little wider so a bulge isn't cut)
    const cl = col.offsetLeft, ct = col.offsetTop, cw = col.clientWidth, ch = col.clientHeight, pad = cw * .15;
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(Math.round((cl - pad) * dpr), Math.round((Hh - ct - ch) * dpr), Math.round((cw + 2 * pad) * dpr), Math.round(ch * dpr));
    const cx = cl + cw / 2 - W / 2;
    for (const c of cards){
      if (!c.vis || c.y == null) continue;
      const i = c.k % N;
      const hp = c.hT == null ? c.hB || 0 : c.hA + (c.hB - c.hA) * bez(Math.min(1, (now - c.hT) / ms(1)));
      gl.bindTexture(gl.TEXTURE_2D, tex[i]);
      gl.uniform2f(U.uImg, imgSize[i][0], imgSize[i][1]);
      gl.uniform3f(U.uCenter, cx, Hh / 2 - (ct + c.y + G.H / 2), 0);
      gl.uniform2f(U.uSize, cw * c.sc, G.H * c.sc);
      gl.uniform2f(U.uOff, 0, c.off);
      gl.uniform1f(U.uZoom, c.mScale * (1 + P.hoverZoom * hp));
      gl.uniform1f(U.uAlpha, c.alpha == null ? 1 : c.alpha);
      gl.drawElements(gl.TRIANGLES, count, gl.UNSIGNED_SHORT, 0);
    }
    gl.disable(gl.SCISSOR_TEST);
  }
  return { init, render, resize };
})();
// hover → per-card zoom (same bezier as everything else)
function setHover(k){
  if (k === S.hoverK) return;
  const now = performance.now();
  const hv = c => c.hT == null ? (c.hB || 0) : c.hA + (c.hB - c.hA) * bez(Math.min(1, (now - c.hT) / ms(1)));
  const prev = cards[S.hoverK], next = cards[k];
  if (prev){ prev.hA = hv(prev); prev.hB = 0; prev.hT = now; }
  if (next){ next.hA = hv(next); next.hB = 1; next.hT = now; }
  S.hoverK = next ? k : -1;
}
col.addEventListener('pointerover', e => { const el = e.target.closest('.card'); setHover(el ? +el.dataset.k : -1); });
col.addEventListener('pointerleave', () => setHover(-1));

let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { measure(); GL.resize(); }, 80); });

/* Pill: mỗi PILL_EVERY giây đổi sang ảnh kế tiếp — lớp mới chồng lên, mask quét từ dưới lên, ảnh zoom out nhẹ */
function startPillCycle(){
  if (PILL_SEQ.length < 2 || RM) return;
  const wrap = $('#pillAv'); if (!wrap) return;
  const cache = PILL_SEQ.map(src => { const im = new Image(); im.decoding = 'async'; im.src = src; return im; });
  let idx = 0, running = false;
  setInterval(() => {
    if (running || document.hidden || current !== 'home' || busy) return;
    const next = (idx + 1) % PILL_SEQ.length;
    if (!cache[next].complete || !cache[next].naturalWidth) return;       // chưa tải xong thì đợi lượt sau
    running = true; idx = next;
    const layer = document.createElement('span'); layer.className = 'av-layer';
    const im = document.createElement('img'); im.src = PILL_SEQ[next]; im.alt = ''; im.draggable = false;
    layer.appendChild(im); wrap.appendChild(layer);
    const D = 1.1;
    layer.animate([{ clipPath:'inset(100% 0 0 0)' }, { clipPath:'inset(0% 0 0 0)' }], { duration: ms(D), easing: EASE, fill:'forwards' });
    const a = im.animate([{ transform:'scale(1.25)' }, { transform:'scale(1)' }], { duration: ms(D + .3), easing: EASE, fill:'forwards' });
    a.onfinish = () => {
      // ảnh mới thành ảnh nền, xoá các lớp cũ
      const base = wrap.querySelector(':scope > img'); if (base) base.src = PILL_SEQ[next];
      requestAnimationFrame(() => { wrap.querySelectorAll('.av-layer').forEach(l => l.remove()); running = false; });
    };
  }, PILL_EVERY * 1000);
}
async function boot(){
  try { await document.fonts.ready; } catch (e) {}
  const r0 = parseRoute();                       // deep links: /about, /work/<slug>
  current = r0.page;
  if (r0.page === 'project') renderProject(r0.i);
  pushRoute(r0, true);
  $('#nav [data-go="home"]').href = hrefFor({ page:'home' });
  $('#nav [data-go="about"]').href = hrefFor({ page:'about' });
  $('#navBack').href = hrefFor({ page:'home' });
  measure(); layoutCards();
  buildGui();
  await GL.init();
  requestAnimationFrame(frame);
  const num = $('#ldNum'), fill = $('#ldFill');
  up([num, $('#ldHandle')], .9, .1, .08);
  await wait(.35);
  await tween({ from: 0, to: 100, d: 2.4, onUpdate: v => { num.textContent = Math.round(v) + '%'; fill.style.transform = `scaleX(${v / 100})`; } }).p;
  await wait(.15);
  A(num, [{ transform:'translateY(0)' }, { transform:'translateY(-110%)' }], .8, 0, { keep: true });
  A($('#ldHandle'), [{ transform:'translateY(0)' }, { transform:'translateY(-110%)' }], .8, .06, { keep: true });
  A($('#ldLine'), [{ transform:'scaleX(1)' }, { transform:'scaleX(0)' }], .8, 0, { keep: true });
  await wait(.5);
  introNav(.35);
  reveal(r0.page, true);
  await wait(1.2);
  $('#ld').style.display = 'none';
  busy = false;
  syncGui();
  startPillCycle();
}
boot();

  .then(r => { if (!r.ok) throw new Error(u + ' HTTP ' + r.status); return r.json(); })
  .catch(e => { if (optional) return {}; throw e; });

    const local = location.protocol === 'file:';
    document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:auto 1.6rem 1.6rem;z-index:999;padding:1.6rem 2rem;background:#111;color:#fff;font:500 14px/1.5 sans-serif;border-radius:8px">
      ${local ? 'Trang cần chạy qua web server (không mở trực tiếp file). Xem README.' : 'Không tải được nội dung (content.json). Kiểm tra lại file này trên GitHub.'}</div>`);
  });
